version: "3.9"

# ─── Infrastructure ───────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
      POSTGRES_DB: devplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devplatform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    command: ["-js", "-m", "8222"]  # enable JetStream + monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 5

  # Local Docker registry (for image storage in dev)
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

# ─── Platform Services ────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_SVC_URL: http://auth:8081
      DEPLOY_SVC_URL: http://deploy:8082
      BUILD_SVC_URL: http://build:8083
      GRAPH_SVC_URL: http://graph:8087
      SECRETS_SVC_URL: http://secrets:8086
      LOGS_SVC_URL: http://logs:8085
    depends_on:
      - auth
      - deploy
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://devplatform:devplatform@postgres:5432/devplatform?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile.deploy
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://devplatform:devplatform@postgres:5432/devplatform?sslmode=disable
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  build:
    build:
      context: .
      dockerfile: docker/Dockerfile.build
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      NATS_URL: nats://nats:4222
      REGISTRY_HOST: registry:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # DinD access
      - build_tmp:/tmp
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  logs:
    build:
      context: .
      dockerfile: docker/Dockerfile.logs
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  secrets:
    build:
      context: .
      dockerfile: docker/Dockerfile.secrets
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      DATABASE_URL: postgres://devplatform:devplatform@postgres:5432/devplatform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  graph:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  registry_data:
  build_tmp:
